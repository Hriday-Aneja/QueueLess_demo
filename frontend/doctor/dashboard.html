<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueLess — Doctor Dashboard</title>
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="css/doctor.css">
</head>

<body data-page="dashboard">

    <div class="app-shell">
        <header class="app-header" id="appShellHeader"></header>

        <div class="app-body">
            <nav class="app-sidenav" id="appShellNav"></nav>

            <main class="app-main">

                <div class="page-header">
                    <div>
                        <h1 class="page-title">Dashboard</h1>
                        <p class="page-subtitle" id="dashboardDateLabel">Today's overview</p>
                    </div>
                    <div class="dashboard-stats" id="dashboardStats"></div>
                </div>

                <!-- Current & Next Patient cards -->
                <section class="patient-cards-row" id="patientCardsRow" aria-label="Current and next patient">
                    <!-- filled by script -->
                </section>

                <!-- Today's Queue -->
                <section class="card queue-card">
                    <div class="card-title-row">
                        <h2 class="card-title">Today's Queue</h2>
                        <span class="text-muted" id="queueCountLabel"></span>
                    </div>

                    <div class="queue-table-wrap">
                        <table class="queue-table" id="queueTable">
                            <thead>
                                <tr>
                                    <th>Token</th>
                                    <th>Patient</th>
                                    <th>Position</th>
                                    <th>Type</th>
                                    <th>ETA</th>
                                    <th>Status</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="queueTableBody"></tbody>
                        </table>
                        <div class="empty-state hidden" id="queueEmptyState">
                            <div class="empty-state-icon">&#128203;</div>
                            <p class="empty-state-title">No patients in the queue</p>
                            <p class="empty-state-text">Your queue for today is currently empty.</p>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="../shared/js/api-client.js"></script>
    <script src="js/doctor-data.js"></script>
    <script src="js/doctor.js"></script>
    <script>
        (function () {
            'use strict';

            var pollTimer = null;

            document.addEventListener('doctor-auth-ready', loadDashboard);
            window.addEventListener('beforeunload', function () {
                if (pollTimer) window.clearTimeout(pollTimer);
            });

            function loadDashboard() {
                window.DoctorApi.doctorDashboard().then(function (result) {
                    if (!result || !result.success) {
                        document.getElementById('patientCardsRow').innerHTML = '<div class="form-alert" role="alert">'
                            + DoctorUI.escapeHtml(result && result.message || 'Unable to load today\'s queue.') + '</div>';
                        schedulePoll();
                        return;
                    }

                    var data = result.data;
                    window.DoctorSession.set(Object.assign({}, window.DoctorSession.get() || {}, data.doctor || {}));
                    window.renderDoctorShell('dashboard');
                    renderDateLabel(data.date);
                    renderStats(data);
                    renderPatientCards(data);
                    renderQueueTable(data.queue || []);
                    schedulePoll();
                });
            }

            function schedulePoll() {
                if (pollTimer) window.clearTimeout(pollTimer);
                pollTimer = window.setTimeout(loadDashboard, 8000);
            }

            function renderDateLabel(date) {
                document.getElementById('dashboardDateLabel').textContent = DoctorUI.formatDate(date) + ' · Today\u2019s overview';
            }

            function renderStats(data) {
                document.getElementById('dashboardStats').innerHTML = [
                    statPill(data.today_appointments, 'Appointments'),
                    statPill(data.waiting_count, 'Waiting'),
                    statPill((data.queue || []).length, 'In Queue')
                ].join('');
            }

            function statPill(value, label) {
                return '<div class="stat-pill"><span class="stat-value">' + value + '</span><span class="stat-label">' + label + '</span></div>';
            }

            function renderPatientCards(data) {
                var current = data.current_patient;
                var next = data.next_patient;
                var row = document.getElementById('patientCardsRow');

                row.innerHTML = patientCardHtml('Current Patient', current, 'current')
                    + patientCardHtml('Next Patient', next, 'next');

                var startBtn = document.getElementById('startConsultBtn');
                if (startBtn) {
                    startBtn.addEventListener('click', function () {
                        if (data.current_patient && data.current_patient.current_status === 'consulting') {
                            window.location.href = 'consultation.html?token_id=' + startBtn.getAttribute('data-token-id');
                            return;
                        }
                        startConsultation(startBtn.getAttribute('data-token-id'));
                    });
                }

                var callNextBtn = document.getElementById('callNextBtn');
                if (callNextBtn) {
                    callNextBtn.addEventListener('click', function () {
                        startConsultation(callNextBtn.getAttribute('data-token-id'));
                    });
                }
            }

            function startConsultation(tokenId) {
                window.DoctorApi.startConsultation(tokenId).then(function (result) {
                    if (!result || !result.success) {
                        document.getElementById('patientCardsRow').innerHTML = '<div class="form-alert" role="alert">'
                            + DoctorUI.escapeHtml(result && result.message || 'Unable to start consultation.') + '</div>';
                        loadDashboard();
                        return;
                    }
                    window.location.href = 'consultation.html?token_id=' + tokenId;
                });
            }

            function patientCardHtml(title, token, variant) {
                if (!token) {
                    return ''
                        + '<div class="card patient-card patient-card-' + variant + '">'
                        + '<div class="card-title-row"><h3 class="card-title">' + title + '</h3></div>'
                        + '<div class="empty-state">'
                        + '<div class="empty-state-icon">&#128100;</div>'
                        + '<p class="empty-state-text">' + (variant === 'current' ? 'No patient currently in consultation.' : 'No patient waiting next.') + '</p>'
                        + '</div>'
                        + '</div>';
                }

                var actionHtml = variant === 'current'
                    ? '<button class="btn btn-primary btn-sm" id="startConsultBtn" data-token-id="' + token.token_id + '">Open Consultation</button>'
                    : '<button class="btn btn-outline btn-sm" id="callNextBtn" data-token-id="' + token.token_id + '">Call Patient</button>';

                return ''
                    + '<div class="card patient-card patient-card-' + variant + '">'
                    + '<div class="card-title-row">'
                    + '<h3 class="card-title">' + title + '</h3>'
                    + DoctorUI.statusBadgeHtml(token.current_status)
                    + '</div>'
                    + '<div class="patient-card-body">'
                    + '<span class="patient-token-no">#' + token.token_number + '</span>'
                    + '<div>'
                    + '<p class="patient-name">' + DoctorUI.escapeHtml(token.patient_name) + '</p>'
                    + '<p class="patient-meta">' + (token.token_type === 'walkin' ? 'Walk-in' : 'Appointment') + ' \u00b7 Queue position ' + token.queue_position + '</p>'
                    + '<p class="patient-reason">Estimated wait: ' + token.estimated_wait_minutes + ' minutes</p>'
                    + '</div>'
                    + '</div>'
                    + '<div class="patient-card-actions">' + actionHtml + '</div>'
                    + '</div>';
            }

            function renderQueueTable(queue) {
                var tbody = document.getElementById('queueTableBody');
                var emptyState = document.getElementById('queueEmptyState');
                var countLabel = document.getElementById('queueCountLabel');

                countLabel.textContent = queue.length + (queue.length === 1 ? ' patient' : ' patients');

                if (!queue.length) {
                    tbody.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                tbody.innerHTML = queue.map(function (t) {
                    return ''
                        + '<tr>'
                        + '<td>#' + t.token_number + '</td>'
                        + '<td>' + DoctorUI.escapeHtml(t.patient_name) + '</td>'
                        + '<td>' + t.queue_position + '</td>'
                        + '<td class="text-muted">' + (t.token_type === 'walkin' ? 'Walk-in' : 'Appointment') + '</td>'
                        + '<td class="text-muted">' + t.estimated_wait_minutes + ' min wait</td>'
                        + '<td>' + DoctorUI.statusBadgeHtml(t.current_status) + '</td>'
                        + '<td><a href="consultation.html?token_id=' + t.token_id + '" class="table-link">View</a></td>'
                        + '</tr>';
                }).join('');
            }
        })();
    </script>
</body>

</html>
