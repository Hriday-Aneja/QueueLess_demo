<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospitals · QueueLess Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-app-page" data-requires-auth="admin" hidden>

  <header class="admin-topbar">
    <div class="admin-topbar-brand">
      <span class="auth-brand-mark">Q</span>
      <span>QueueLess Admin</span>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-link" data-nav="dashboard">Dashboard</a>
      <a href="hospitals.html" class="admin-nav-link" data-nav="hospitals">Hospitals</a>
      <a href="doctors.html" class="admin-nav-link" data-nav="doctors">Doctors</a>
    </nav>
    <div class="admin-topbar-user">
      <span id="adminUserName"></span>
      <button type="button" id="logoutBtn" class="btn-secondary">Log Out</button>
    </div>
  </header>

  <main class="admin-main">

    <div class="dash-header">
      <div>
        <h1 class="dash-title">Hospitals / Clinics</h1>
        <p class="dash-subtitle">Manage the hospitals doctors and departments belong to.</p>
      </div>
      <div class="dash-header-actions">
        <button type="button" class="btn-primary btn-inline" id="addClinicBtn">+ Add Hospital</button>
      </div>
    </div>

    <div class="dash-alert" id="clinicsError" role="alert" hidden>
      <span id="clinicsErrorText">Something went wrong.</span>
      <button type="button" class="btn-secondary" id="clinicsRetryBtn">Retry</button>
    </div>

    <div class="toast" id="clinicsToast" hidden></div>

    <section class="panel">
      <div class="table-scroll">
        <table class="data-table" id="clinicsTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Address</th>
              <th>Phone</th>
              <th>Departments</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clinicsTableBody"></tbody>
        </table>
        <p class="empty-state" id="clinicsLoading">Loading hospitals…</p>
        <p class="empty-state" id="clinicsEmpty" hidden>No hospitals yet — add the first one above.</p>
      </div>
    </section>

  </main>

  <!-- Add / Edit Hospital modal -->
  <div class="modal-backdrop" id="clinicModalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="clinicModalTitle">
      <h2 class="modal-title" id="clinicModalTitle">Add Hospital</h2>
      <form id="clinicForm" novalidate>
        <input type="hidden" id="clinicId">

        <div class="form-group">
          <label for="clinicName">Hospital / Clinic Name</label>
          <input type="text" id="clinicName" required maxlength="150">
          <span class="field-error" id="clinicNameError"></span>
        </div>

        <div class="form-group">
          <label for="clinicAddress">Address</label>
          <input type="text" id="clinicAddress" maxlength="255">
          <span class="field-error" id="clinicAddressError"></span>
        </div>

        <div class="form-group">
          <label for="clinicPhone">Phone</label>
          <input type="text" id="clinicPhone" maxlength="20">
          <span class="field-error" id="clinicPhoneError"></span>
        </div>

        <div class="form-group form-group-checkbox">
          <label><input type="checkbox" id="clinicActive" checked> Active</label>
        </div>

        <div class="form-alert" id="clinicFormAlert" role="alert" hidden></div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="clinicCancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="clinicSaveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../shared/js/api-client.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
